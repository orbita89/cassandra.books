[package]
name = "library_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- GUI -------------------------------------------------------------------
eframe = "0.37"
egui = "0.37"
# `file` — загрузка обложек через file://, `webp` — их декодирование.
# Без этих двух фич обложки в интерфейсе просто не появятся.
egui_extras = { version = "0.37", features = ["image", "file", "webp"] }
# Системные диалоги выбора файла/папки.
rfd = "0.18"

# --- Связь потоков ---------------------------------------------------------
crossbeam-channel = "0.5"

# --- Поиск -----------------------------------------------------------------
tantivy = "0.27"

# --- Пайплайн (тот же проверенный код, что и в CLI) -------------------------
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# Версии совпадают с CLI-проектом, чтобы `images.rs` работал без правок.
zip = "6"
zip-extensions = "0.13"
# `avif` (кодирование) включён по умолчанию; `avif-native` добавляет
# декодирование AVIF через libdav1d — нужно, чтобы обложки в `.avif`
# показывались в интерфейсе и чтобы перечитать уже сконвертированный EPUB.
image = { version = "0.25", features = ["avif-native"] }
libwebp-sys = "0.9"
# Subsetting встроенных шрифтов через HarfBuzz (системный `libharfbuzz`).
# Необязательная зависимость: выключается фичей `--no-default-features fonts`,
# если в системе нет заголовков harfbuzz и clang (bindgen).
hb-subset = { version = "0.3", optional = true }
rayon = "1"
# Разбор FB2 в нативном конвертере (`src/fb2epub.rs`) — вместо Calibre.
quick-xml = "0.42"

[features]
default = ["fonts", "asm"]
# Шаг 2 пайплайна: ужать встроенные шрифты до символов книги.
fonts = ["dep:hb-subset"]
# Ассемблерные ядра rav1e (x86_64/ARM). Даёт ровно тот же результат, но в
# 1.77 раза быстрее: импорт 100 книг занимает 140 с вместо 247 с. Требует
# `nasm` в PATH при сборке (`sudo pacman -S nasm`); если его нет, соберите
# `cargo build --release --no-default-features --features fonts`.
asm = ["image/nasm"]

[profile.release]
# `opt-level = 3` с `lto = "thin"` и `codegen-units = 1` здесь проверялись:
# на импорте это не дало ничего (247.5 с против 245.6 с, то есть шум), а
# собирать проект заставляет в разы дольше. Время уходит внутри rav1e, а не
# в нашем коде, поэтому профиль остаётся обычным.
opt-level = 2
