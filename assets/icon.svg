<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#403A6B"/>
      <stop offset="0.55" stop-color="#2A2547"/>
      <stop offset="1" stop-color="#191630"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#E4DAC1"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#DCD1B6"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#E8A020"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#bg)"/>

    <!-- мягкое свечение за книгой -->
    <ellipse cx="128" cy="150" rx="96" ry="70" fill="#6C63FF" opacity="0.20"/>
  </g>

  <!-- тень под книгой -->
  <ellipse cx="128" cy="215" rx="80" ry="12" fill="#000000" opacity="0.35"/>

  <!-- левая страница -->
  <path d="M126 84 C 106 66, 74 59, 36 64 L 36 194 C 74 189, 106 196, 126 214 Z"
        fill="url(#pageL)"/>
  <!-- правая страница -->
  <path d="M130 84 C 150 66, 182 59, 220 64 L 220 194 C 182 189, 150 196, 130 214 Z"
        fill="url(#pageR)"/>

  <!-- строки текста на левой странице -->
  <g fill="#8C7F63" opacity="0.55">
    <rect x="50" y="94"  width="60" height="6" rx="3"/>
    <rect x="50" y="110" width="66" height="6" rx="3"/>
    <rect x="50" y="126" width="52" height="6" rx="3"/>
    <rect x="50" y="142" width="64" height="6" rx="3"/>
    <rect x="50" y="158" width="44" height="6" rx="3"/>
    <rect x="50" y="174" width="58" height="6" rx="3"/>
  </g>
  <!-- строки текста на правой странице -->
  <g fill="#8C7F63" opacity="0.55">
    <rect x="146" y="94"  width="60" height="6" rx="3"/>
    <rect x="146" y="110" width="52" height="6" rx="3"/>
    <rect x="146" y="126" width="66" height="6" rx="3"/>
    <rect x="146" y="142" width="46" height="6" rx="3"/>
    <rect x="146" y="158" width="62" height="6" rx="3"/>
    <rect x="146" y="174" width="54" height="6" rx="3"/>
  </g>

  <!-- корешок -->
  <path d="M128 82 L 128 216" stroke="#B9AB8C" stroke-width="3" opacity="0.75"/>
  <path d="M120 84 L 120 214" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
  <path d="M136 84 L 136 214" stroke="#000000" stroke-width="2" opacity="0.10"/>

  <!-- закладка -->
  <path d="M170 62 L 194 62 L 194 138 L 182 124 L 170 138 Z" fill="url(#ribbon)"/>
  <path d="M170 62 L 194 62 L 194 72 L 170 72 Z" fill="#FFFFFF" opacity="0.22"/>
</svg>
